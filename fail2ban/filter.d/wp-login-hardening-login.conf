# Login Hardening for WordPress, failed logins: wrong password, unknown user,
# empty name, WooCommerce logins refused before authentication (for example by
# a captcha), wrong application passwords.
# The first three lines are the ones WP fail2ban writes, with the same tag.

[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:wordpress|wp)
failregex = ^%(__prefix_line)sAuthentication failure for .* from <HOST>$
            ^%(__prefix_line)sAuthentication attempt for unknown user .* from <HOST>$
            ^%(__prefix_line)sEmpty username from <HOST>$
            ^%(__prefix_line)sWooCommerce login rejected before authentication for .* from <HOST>$
            ^%(__prefix_line)sApplication password failure for .* from <HOST>$
ignoreregex =
