# Login Hardening for WordPress: requests refused by the plugin, user
# enumeration and XML-RPC.

[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:wordpress|wp)
failregex = ^%(__prefix_line)sBlocked user enumeration attempt from <HOST>$
            ^%(__prefix_line)sXML-RPC request blocked from <HOST>$
ignoreregex =
